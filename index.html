<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Banner Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&family=Libre+Baskerville:ital@1&family=Roboto+Slab:wght@700&family=Merriweather:wght@700&family=Oswald:wght@700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-bg-color: #ffffff;
            --tg-text-color: #000000;
            --tg-button-color: #0088cc;
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--tg-bg-color);
            color: var(--tg-text-color);
        }
        button {
            background-color: var(--tg-button-color);
            color: #ffffff;
        }
        .banner-container { width: 100%; max-width: 600px; aspect-ratio: 16 / 9; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .placeholder-bg { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='12' ry='12' stroke='%23d1d5db' stroke-width='3' stroke-dasharray='6%2c 14' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); background-color: #f9fafb; }
        .dark .placeholder-bg { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='12' ry='12' stroke='%234b5563' stroke-width='3' stroke-dasharray='6%2c 14' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); background-color: #374151; }
        .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator { cursor: pointer; filter: invert(0.6); }
        .dark input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        input[type="range"] { background: transparent; cursor: pointer; }
        input[type="range"]::-webkit-slider-track { width: 100%; height: 8px; cursor: pointer; background: #e5e7eb; border-radius: 4px; }
        input[type="range"]::-webkit-slider-thumb { height: 20px; width: 20px; border-radius: 50%; background: #5D5CDE; cursor: pointer; -webkit-appearance: none; margin-top: -6px; }
        .dark input[type="range"]::-webkit-slider-track { background: #4b5563; }
    </style>
</head>
<body class="overflow-hidden flex flex-col h-screen">
    <div id="app" class="flex-grow flex flex-col items-center p-4 space-y-4 overflow-y-auto">
        <h1 class="text-2xl font-bold text-center flex-shrink-0 flex items-center gap-2">
            <i class="ph-fill ph-confetti text-blue-500"></i> Party Banner Creator
        </h1>
        <div class="w-full max-w-md space-y-4">
            <div id="image-upload-section" class="p-6 bg-white dark:bg-gray-800 rounded-xl shadow-md">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2"><i class="ph-bold ph-image text-green-500"></i> 1. Upload Photo</h2>
                <label for="image-upload" class="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:hover:bg-bray-800 dark:bg-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:hover:border-gray-500 dark:hover:bg-gray-600">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <i class="ph-bold ph-upload text-4xl text-gray-500 dark:text-gray-400 mb-2"></i>
                        <p class="mb-2 text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold">Click to upload</span></p>
                        <p class="text-xs text-gray-500 dark:text-gray-400">PNG or JPG</p>
                    </div>
                    <input id="image-upload" type="file" class="hidden" accept="image/png, image/jpeg" />
                </label>
            </div>
            <div id="customization-section" class="p-6 bg-white dark:bg-gray-800 rounded-xl shadow-md space-y-6 hidden">
                <h2 class="text-xl font-semibold flex items-center gap-2"><i class="ph-bold ph-paint-brush text-purple-500"></i> 2. Customize Banner</h2>
                <div class="space-y-4">
                    <h3 class="font-semibold text-lg">Event Details</h3>
                    <div>
                        <label for="event-selector" class="block mb-2 text-sm font-medium">Event Type</label>
                        <select id="event-selector" class="w-full p-2 border border-gray-300 rounded-md bg-white dark:bg-gray-700 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                            <option value="wedding">Wedding</option>
                            <option value="birthday">Birthday</option>
                            <option value="congratulations">Congratulations</option>
                            <option value="graduation">Graduation</option>
                            <option value="baby_shower">Baby Shower</option>
                            <option value="new_home">New Home</option>
                            <option value="funeral">In Loving Memory</option>
                            <option value="get_well">Get Well Soon</option>
                        </select>
                    </div>
                    <div>
                        <label for="header-text" class="block mb-2 text-sm font-medium">Header Title</label>
                        <input type="text" id="header-text" class="w-full p-2 border border-gray-300 rounded-md bg-white dark:bg-gray-700 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="main-content-text" class="block mb-2 text-sm font-medium">Main Content</label>
                        <textarea id="main-content-text" rows="3" class="w-full p-2 border border-gray-300 rounded-md bg-white dark:bg-gray-700 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>
                    <div>
                        <label for="location-text" class="block mb-2 text-sm font-medium">Location</label>
                        <input type="text" id="location-text" class="w-full p-2 border border-gray-300 rounded-md bg-white dark:bg-gray-700 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="date-time-picker" class="block mb-2 text-sm font-medium">Date & Time</label>
                        <input type="datetime-local" id="date-time-picker" class="w-full p-2 border border-gray-300 rounded-md bg-white dark:bg-gray-700 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                <div class="space-y-4">
                    <h3 class="font-semibold text-lg">Appearance</h3>
                    <div>
                        <label for="layout-selector" class="block mb-2 text-sm font-medium">Layout Style</label>
                        <select id="layout-selector" class="w-full p-2 border border-gray-300 rounded-md bg-white dark:bg-gray-700 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                            <option value="split-left">Text Left, Image Right</option>
                            <option value="split-right">Text Right, Image Left</option>
                            <option value="overlay">Overlay Layout</option>
                        </select>
                    </div>
                    <div>
                        <label for="font-selector" class="block mb-2 text-sm font-medium">Select a Font</label>
                        <select id="font-selector" class="w-full p-2 border border-gray-300 rounded-md bg-white dark:bg-gray-700 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                            <option value="Dancing Script">Dancing Script</option>
                            <option value="Playfair Display">Playfair Display</option>
                            <option value="Libre Baskerville">Libre Baskerville</option>
                            <option value="Roboto Slab">Roboto Slab</option>
                            <option value="Merriweather">Merriweather</option>
                            <option value="Oswald">Oswald</option>
                            <option value="Montserrat">Montserrat</option>
                            <option value="Poppins">Poppins</option>
                        </select>
                    </div>
                    <div>
                        <label for="color-theme" class="block mb-2 text-sm font-medium">Color Theme</label>
                        <select id="color-theme" class="w-full p-2 border border-gray-300 rounded-md bg-white dark:bg-gray-700 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                            <option value="classic">Classic White</option>
                            <option value="gold">Elegant Gold</option>
                            <option value="rose">Rose Gold</option>
                            <option value="blue">Ocean Blue</option>
                            <option value="green">Nature Green</option>
                            <option value="purple">Royal Purple</option>
                            <option value="custom">Custom Colors</option>
                        </select>
                    </div>
                    <div id="custom-colors" class="space-y-4 hidden">
                        <div>
                            <label for="text-color" class="block mb-2 text-sm font-medium">Text Color</label>
                            <input type="color" id="text-color" value="#FFFFFF" class="w-full h-10 border border-gray-300 rounded-md">
                        </div>
                        <div>
                            <label for="overlay-color" class="block mb-2 text-sm font-medium">Overlay Color</label>
                            <input type="color" id="overlay-color" value="#000000" class="w-full h-10 border border-gray-300 rounded-md">
                        </div>
                    </div>
                    <div>
                        <label for="overlay-opacity" class="block mb-2 text-sm font-medium">Background Opacity</label>
                        <input type="range" id="overlay-opacity" min="0" max="100" value="50" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="text-xs text-gray-500 text-center mt-1"><span id="opacity-value">50</span>%</div>
                    </div>
                </div>
                <div class="space-y-4">
                    <h3 class="font-semibold text-lg">Text Settings</h3>
                    <div>
                        <label for="header-size" class="block mb-2 text-sm font-medium">Header Size</label>
                        <input type="range" id="header-size" min="60" max="200" value="120" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="text-xs text-gray-500 text-center mt-1"><span id="header-size-value">120</span>px</div>
                    </div>
                    <div>
                        <label for="content-size" class="block mb-2 text-sm font-medium">Content Size</label>
                        <input type="range" id="content-size" min="30" max="80" value="55" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="text-xs text-gray-500 text-center mt-1"><span id="content-size-value">55</span>px</div>
                    </div>
                </div>
            </div>
            <div id="banner-preview-section" class="p-6 bg-white dark:bg-gray-800 rounded-xl shadow-md space-y-4 hidden">
                <h2 class="text-xl font-semibold flex items-center gap-2"><i class="ph-bold ph-sparkle text-yellow-500"></i> 3. Preview & Share</h2>
                <div class="banner-container mx-auto rounded-lg overflow-hidden placeholder-bg relative">
                    <canvas id="banner-canvas" class="w-full h-full"></canvas>
                </div>
                <div class="grid grid-cols-1 gap-2">
                   <button id="download-button" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition duration-300 ease-in-out disabled:bg-gray-400 icon-button">
                        <i class="ph-bold ph-download-simple"></i> Download
                    </button>
                    <button id="share-button" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition duration-300 ease-in-out disabled:bg-gray-400 icon-button">
                        <i class="ph-bold ph-telegram-logo"></i> Share
                    </button>
                </div>
                <button id="reset-button" class="w-full bg-green-200 py-2 px-4 rounded transition duration-300 ease-in-out mt-2 icon-button">
                    <i class="ph-bold ph-arrow-counter-clockwise"></i> Start Over
                </button>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            try {
                tg.ready();
                tg.expand();
                const themeParams = tg.themeParams;
                document.documentElement.style.setProperty('--tg-bg-color', themeParams.bg_color || '#ffffff');
                document.documentElement.style.setProperty('--tg-text-color', themeParams.text_color || '#000000');
                document.documentElement.style.setProperty('--tg-button-color', themeParams.button_color || '#0088cc');
            } catch (error) {
                console.warn("Telegram WebApp script not found or failed. Running in standalone mode.");
            }

            const imageUploadSection = document.getElementById('image-upload-section');
            const customizationSection = document.getElementById('customization-section');
            const bannerPreviewSection = document.getElementById('banner-preview-section');
            const imageUploadInput = document.getElementById('image-upload');
            const layoutSelector = document.getElementById('layout-selector');
            const eventSelector = document.getElementById('event-selector');
            const fontSelector = document.getElementById('font-selector');
            const colorThemeSelector = document.getElementById('color-theme');
            const customColorsDiv = document.getElementById('custom-colors');
            const textColorInput = document.getElementById('text-color');
            const overlayColorInput = document.getElementById('overlay-color');
            const overlayOpacitySlider = document.getElementById('overlay-opacity');
            const opacityValueDisplay = document.getElementById('opacity-value');
            const headerSizeSlider = document.getElementById('header-size');
            const headerSizeValue = document.getElementById('header-size-value');
            const contentSizeSlider = document.getElementById('content-size');
            const contentSizeValue = document.getElementById('content-size-value');
            const headerTextInput = document.getElementById('header-text');
            const mainContentTextInput = document.getElementById('main-content-text');
            const locationTextInput = document.getElementById('location-text');
            const dateTimePicker = document.getElementById('date-time-picker');
            const canvas = document.getElementById('banner-canvas');
            const ctx = canvas.getContext('2d');
            const downloadButton = document.getElementById('download-button');
            const shareButton = document.getElementById('share-button');
            const resetButton = document.getElementById('reset-button');

            canvas.width = 1920;
            canvas.height = 1080;

            let userImage = null;

            const colorThemes = {
                classic: { text: '#FFFFFF', overlay: '#000000' },
                gold: { text: '#FFD700', overlay: '#8B4513' },
                rose: { text: '#FFB6C1', overlay: '#8B0000' },
                blue: { text: '#87CEEB', overlay: '#000080' },
                green: { text: '#98FB98', overlay: '#006400' },
                purple: { text: '#DDA0DD', overlay: '#4B0082' }
            };
            const eventTemplates = {
                wedding: { header: "Save the Date", content: "Join us to celebrate the wedding of", headerSize: 120, contentSize: 55, defaultFont: 'Dancing Script', color: "#FFFFFF" },
                birthday: { header: "Happy Birthday!", content: "Wishing you the best on your special day!", headerSize: 130, contentSize: 50, defaultFont: 'Playfair Display', color: "#FFFFFF" },
                congratulations: { header: "Congratulations!", content: "We're so proud of your amazing achievement!", headerSize: 125, contentSize: 50, defaultFont: 'Roboto Slab', color: "#FFFFFF" },
                graduation: { header: "The Tassel Was Worth the Hassle", content: "Celebrating the graduation of", headerSize: 110, contentSize: 50, defaultFont: 'Merriweather', color: "#FFFFFF"},
                baby_shower: { header: "A Little Star is on the Way", content: "Join us for a baby shower honoring", headerSize: 100, contentSize: 50, defaultFont: 'Dancing Script', color: "#FFFFFF" },
                new_home: { header: "Home Sweet Home", content: "We've moved! Come celebrate with us.", headerSize: 115, contentSize: 50, defaultFont: 'Montserrat', color: "#FFFFFF"},
                funeral: { header: "In Loving Memory", content: "Forever in our hearts", headerSize: 110, contentSize: 50, defaultFont: 'Libre Baskerville', color: "#FFFFFF" },
                get_well: { header: "Get Well Soon", content: "Sending our love and support", headerSize: 115, contentSize: 50, defaultFont: 'Playfair Display', color: "#FFFFFF" }
            };

            function updateTemplate() {
                const selectedEvent = eventSelector.value;
                const template = eventTemplates[selectedEvent];
                headerTextInput.value = template.header;
                mainContentTextInput.value = template.content;
                fontSelector.value = template.defaultFont;
                headerSizeSlider.value = template.headerSize;
                contentSizeSlider.value = template.contentSize;
                headerSizeValue.textContent = template.headerSize;
                contentSizeValue.textContent = template.contentSize;
                locationTextInput.value = 'Addis Ababa, Ethiopia';
                const now = new Date();
                now.setDate(now.getDate() + 7);
                now.setHours(19, 0, 0, 0);
                const year = now.getFullYear();
                const month = (now.getMonth() + 1).toString().padStart(2, '0');
                const day = now.getDate().toString().padStart(2, '0');
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                dateTimePicker.value = `${year}-${month}-${day}T${hours}:${minutes}`;
                drawBanner();
            }

            imageUploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        userImage = new Image();
                        userImage.onload = () => {
                            imageUploadSection.classList.add('hidden');
                            customizationSection.classList.remove('hidden');
                            bannerPreviewSection.classList.remove('hidden');
                            updateTemplate();
                        };
                        userImage.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            colorThemeSelector.addEventListener('change', () => {
                const selectedTheme = colorThemeSelector.value;
                customColorsDiv.classList.toggle('hidden', selectedTheme !== 'custom');
                if (selectedTheme !== 'custom') {
                    const theme = colorThemes[selectedTheme];
                    textColorInput.value = theme.text;
                    overlayColorInput.value = theme.overlay;
                }
                drawBanner();
            });

            overlayOpacitySlider.addEventListener('input', () => {
                opacityValueDisplay.textContent = overlayOpacitySlider.value;
                drawBanner();
            });
            headerSizeSlider.addEventListener('input', () => {
                headerSizeValue.textContent = headerSizeSlider.value;
                drawBanner();
            });
            contentSizeSlider.addEventListener('input', () => {
                contentSizeValue.textContent = contentSizeSlider.value;
                drawBanner();
            });
            [eventSelector, fontSelector, layoutSelector, textColorInput, overlayColorInput,
             headerTextInput, mainContentTextInput, locationTextInput, dateTimePicker].forEach(el => {
                el.addEventListener('input', () => {
                    if (el.id === 'event-selector') updateTemplate();
                    else drawBanner();
                });
            });

            resetButton.addEventListener('click', () => {
                userImage = null;
                imageUploadInput.value = '';
                imageUploadSection.classList.remove('hidden');
                customizationSection.classList.add('hidden');
                bannerPreviewSection.classList.add('hidden');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                shareButton.disabled = true;
                downloadButton.disabled = true;
                colorThemeSelector.value = 'classic';
                customColorsDiv.classList.add('hidden');
                layoutSelector.value = 'split-left';
                overlayOpacitySlider.value = 50;
                opacityValueDisplay.textContent = '50';
                headerSizeSlider.value = 120;
                contentSizeSlider.value = 55;
                headerSizeValue.textContent = '120';
                contentSizeValue.textContent = '55';
            });

          downloadButton.addEventListener('click', () => {
    const dataURL = canvas.toDataURL('image/png');
    const fileName = `${eventSelector.value}-banner.png`;

    // Convert Data URL to Blob
    fetch(dataURL)
        .then(res => res.blob())
        .then(blob => {
            // Create a Blob URL
            const blobUrl = URL.createObjectURL(blob);

            // Check if Telegram WebApp object exists
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.requestFileDownload({
                    url: blobUrl,
                    file_name: fileName
                });
            } else {
                // Fallback for regular web browsers (outside of Telegram Web App)
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                link.click();
                URL.revokeObjectURL(blobUrl); // Clean up the Blob URL
            }
        })
        .catch(error => {
            console.error('Error creating Blob or requesting download:', error);
            // Optionally show an alert to the user
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.showAlert(`Error downloading file: ${error.message}`);
            } else {
                alert(`Error downloading file: ${error.message}`);
            }
        });
});

      shareButton.addEventListener('click', () => {
    canvas.toBlob((blob) => {
        if (!blob) {
            console.error("Failed to create blob for sharing.");
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.showAlert("Failed to prepare image for sharing.");
            } else {
                alert("Failed to prepare image for sharing.");
            }
            return;
        }

        const fileName = `${eventSelector.value}-banner.png`;
        const file = new File([blob], fileName, { type: 'image/png' });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
                files: [file],
                title: 'Check out my banner!',
                text: 'Created using my awesome Telegram Mini App.',
            })
            .then(() => console.log('Shared successfully'))
            .catch((error) => {
                console.error('Error sharing:', error);
                if (window.Telegram && window.Telegram.WebApp) {
                    Telegram.WebApp.showAlert(`Share failed: ${error.message}. Try downloading and sharing manually.`);
                } else {
                    alert(`Share failed: ${error.message}. Try downloading and sharing manually.`);
                }
            });
        } else {
            // Fallback if Web Share API is not supported or cannot share files
            console.warn("Web Share API not supported or cannot share files directly. Offering download instead.");
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
            URL.revokeObjectURL(link.href); // Clean up Blob URL

            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.showAlert("Your browser doesn't support direct sharing. Image downloaded! You can share it manually.");
            } else {
                alert("Your browser doesn't support direct sharing. Image downloaded!");
            }
        }
    }, 'image/png');
});

            function formatDateTime(dateTimeString) {
                if (!dateTimeString) return "";
                const date = new Date(dateTimeString);
                const optionsDate = { year: 'numeric', month: 'long', day: 'numeric' };
                const optionsTime = { hour: 'numeric', minute: '2-digit', hour12: true };
                return `${date.toLocaleDateString('en-US', optionsDate)} at ${date.toLocaleTimeString('en-US', optionsTime)}`;
            }

            function wrapText(context, text, x, y, maxWidth, lineHeight, maxY) {
                const lines = text.split('\n');
                let lastY = y;
                let truncated = false;
                for (const lineText of lines) {
                    const words = lineText.split(' ');
                    let line = '';
                    for (let n = 0; n < words.length; n++) {
                        const testLine = line + words[n] + ' ';
                        const metrics = context.measureText(testLine);
                        if (metrics.width > maxWidth && n > 0) {
                            if (lastY + lineHeight > maxY) {
                                truncated = true;
                                break;
                            }
                            context.fillText(line.trim(), x, lastY);
                            line = words[n] + ' ';
                            lastY += lineHeight;
                        } else {
                            line = testLine;
                        }
                    }
                    if (!truncated && lastY + lineHeight <= maxY) {
                        context.fillText(line.trim(), x, lastY);
                        lastY += lineHeight;
                    } else {
                        truncated = true;
                        break;
                    }
                }
                if (truncated && lastY - lineHeight <= maxY) context.fillText('...', x, lastY - lineHeight);
                return { lastY: lastY - lineHeight, truncated };
            }

            function drawBanner() {
                if (!userImage) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const selectedFont = fontSelector.value;
                const layout = layoutSelector.value;
                const textColor = textColorInput.value;
                const overlayColor = overlayColorInput.value;
                const overlayOpacity = overlayOpacitySlider.value / 100;
                const headerSize = parseInt(headerSizeSlider.value);
                const contentSize = parseInt(contentSizeSlider.value);
                const padding = 100;

                if (layout.startsWith('split')) drawSplitLayout(layout === 'split-left' ? 'left' : 'right');
                else if (layout === 'overlay') drawOverlayLayout();

                function drawSplitLayout(textSide) {
                    const textPanelWidth = canvas.width * 0.5;
                    const textAreaX = textSide === 'left' ? 0 : canvas.width - textPanelWidth;
                    const imagePanelX = textSide === 'left' ? textPanelWidth : 0;
                    const imagePanelWidth = canvas.width - textPanelWidth;

                    ctx.save();
                    const coverRatio = Math.max(canvas.width / userImage.width, canvas.height / userImage.height);
                    const coverWidth = userImage.width * coverRatio;
                    const coverHeight = userImage.height * coverRatio;
                    const coverX = (canvas.width - coverWidth) / 2;
                    const coverY = (canvas.height - coverHeight) / 2;
                    ctx.filter = `blur(20px) brightness(${overlayOpacity})`;
                    ctx.drawImage(userImage, coverX, coverY, coverWidth, coverHeight);
                    ctx.restore();

                    ctx.save();
                    ctx.fillStyle = overlayColor;
                    ctx.globalAlpha = overlayOpacity * 0.3;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.restore();

                    ctx.save();
                    const imageMargin = 30;
                    const fitRatio = Math.min((imagePanelWidth - imageMargin * 2) / userImage.width, (canvas.height - imageMargin * 2) / userImage.height);
                    const imgNewWidth = userImage.width * fitRatio;
                    const imgNewHeight = userImage.height * fitRatio;
                    const centerShiftX = imagePanelX + (imagePanelWidth - imgNewWidth) / 2;
                    const centerShiftY = (canvas.height - imgNewHeight) / 2;
                    ctx.drawImage(userImage, centerShiftX, centerShiftY, imgNewWidth, imgNewHeight);
                    ctx.restore();

                    drawTextContent(textAreaX + textPanelWidth / 2, textPanelWidth - padding * 2, 0, canvas.height);
                }

                function drawOverlayLayout() {
                    ctx.save();
                    const coverRatio = Math.max(canvas.width / userImage.width, canvas.height / userImage.height);
                    const coverWidth = userImage.width * coverRatio;
                    const coverHeight = userImage.height * coverRatio;
                    const coverX = (canvas.width - coverWidth) / 2;
                    const coverY = (canvas.height - coverHeight) / 2;
                    ctx.drawImage(userImage, coverX, coverY, coverWidth, coverHeight);
                    ctx.restore();

                    ctx.save();
                    ctx.fillStyle = overlayColor;
                    ctx.globalAlpha = overlayOpacity;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.restore();

                    drawTextContent(canvas.width / 2, canvas.width - padding * 2, 0, canvas.height);
                }

                function drawTextContent(centerX, maxWidth, startY, maxY) {
                    const textAreaHeight = maxY - startY;
                    const headerStartY = startY;
                    const headerMaxY = startY + 0.2 * textAreaHeight;
                    const contentStartY = startY + 0.25 * textAreaHeight;
                    const contentMaxY = startY + 0.75 * textAreaHeight;
                    const footerStartY = startY + 0.8 * textAreaHeight;
                    const footerMaxY = startY + 0.9 * textAreaHeight;

                    ctx.fillStyle = textColor;
                    ctx.textAlign = 'center';

                    ctx.font = `bold ${headerSize}px '${selectedFont}'`;
                    wrapText(ctx, headerTextInput.value, centerX, headerStartY + padding, maxWidth, headerSize * 1.2, headerMaxY);

                    ctx.font = `${contentSize}px '${selectedFont}'`;
                    wrapText(ctx, mainContentTextInput.value, centerX, contentStartY, maxWidth, contentSize * 1.4, contentMaxY);

                    const detailSize = Math.max(24, contentSize * 0.6);
                    const footerText = `Location: ${locationTextInput.value}\nDate: ${formatDateTime(dateTimePicker.value)}`;
                    ctx.font = `${detailSize}px 'Poppins'`;
                    wrapText(ctx, footerText, centerX, footerStartY, maxWidth, detailSize * 1.5, footerMaxY);
                }

                shareButton.disabled = false;
                downloadButton.disabled = false;
            }
        });
    </script>
</body>
