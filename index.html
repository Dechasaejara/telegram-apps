<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Scavenger Hunt</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Custom Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Use Inter font as default */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Simple transition for screen visibility */
        .screen {
            transition: opacity 0.3s ease-in-out;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; /* bg-gray-800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; /* bg-gray-600 */
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* bg-gray-500 */
        }
    </style>
</head>
<body class="bg-gray-900 text-white antialiased">

    <div id="app" class="min-h-screen p-4 flex flex-col justify-center items-center">

        <!-- Welcome Screen -->
        <div id="welcome-screen" class="screen w-full max-w-md text-center">
            <h1 class="text-4xl font-bold text-cyan-400 mb-2">GeoQuest</h1>
            <p class="text-gray-400 mb-6">Find teammates nearby and start a scavenger hunt!</p>
            <p class="text-xs text-gray-500 mb-8">Your User ID: <span id="user-id-display" class="font-mono">loading...</span></p>
            <button id="find-players-btn" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-transform transform hover:scale-105">
                Find Nearby Players
            </button>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen" class="screen w-full max-w-md text-center hidden">
             <div class="flex justify-center items-center space-x-2">
                <svg class="animate-spin h-8 w-8 text-cyan-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-lg text-gray-300">Finding players...</span>
            </div>
        </div>
        
        <!-- Error Screen -->
        <div id="error-screen" class="screen w-full max-w-md text-center hidden p-4 bg-red-900/50 border border-red-700 rounded-lg">
            <h2 class="text-xl font-bold text-red-400 mb-2">Oops!</h2>
            <p id="error-message" class="text-red-300"></p>
        </div>

        <!-- Players List Screen -->
        <div id="players-list-screen" class="screen w-full max-w-md hidden">
            <h2 class="text-2xl font-bold mb-4 text-center">Nearby Players</h2>
            <div id="nearby-players" class="space-y-3 max-h-96 overflow-y-auto p-1">
                <!-- Player items will be injected here -->
            </div>
            <p id="no-players-message" class="text-center text-gray-500 mt-6 hidden">No players found nearby. Try moving closer to others!</p>
            <button id="back-to-welcome-btn" class="mt-6 w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg transition">
                Back
            </button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen w-full max-w-md hidden">
            <div class="bg-gray-800 p-6 rounded-lg shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-cyan-400">Game On!</h2>
                    <div class="text-lg font-mono bg-gray-900 px-3 py-1 rounded-md">Score: <span id="score">0</span></div>
                </div>
                <div id="task-container" class="mb-6">
                    <p class="text-gray-400 mb-2">Current Task:</p>
                    <p id="task" class="text-xl font-medium"></p>
                </div>
                <div id="game-over-message" class="text-center hidden">
                    <h3 class="text-3xl font-bold text-green-400">Congratulations!</h3>
                    <p class="text-gray-300 mt-2">You've completed all the tasks!</p>
                </div>
                <div id="answer-section">
                    <input type="text" id="answer-input" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Type your answer...">
                    <button id="submit-answer-btn" class="mt-4 w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:scale-105">
                        Submit Answer
                    </button>
                </div>
                 <button id="leave-game-btn" class="mt-4 w-full bg-red-700 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition">
                    Leave Game
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        // Import functions from the Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, serverTimestamp, GeoPoint, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION ---
        const NEARBY_RADIUS_KM = 5; // Players within 5km are considered "nearby"
        const SCAVENGER_HUNT_TASKS = [
            { task: "What is the color of the sky?", answer: "blue" },
            { task: "What is the capital of Ethiopia?", answer: "addis ababa" },
            { task: "How many letters are in 'Telegram'?", answer: "8" },
        ];

        // --- DOM ELEMENTS ---
        const screens = {
            welcome: document.getElementById('welcome-screen'),
            loading: document.getElementById('loading-screen'),
            error: document.getElementById('error-screen'),
            playersList: document.getElementById('players-list-screen'),
            game: document.getElementById('game-screen'),
        };
        const findPlayersBtn = document.getElementById('find-players-btn');
        const backToWelcomeBtn = document.getElementById('back-to-welcome-btn');
        const nearbyPlayersContainer = document.getElementById('nearby-players');
        const noPlayersMessage = document.getElementById('no-players-message');
        const userIdDisplay = document.getElementById('user-id-display');
        const errorMessage = document.getElementById('error-message');
        const scoreDisplay = document.getElementById('score');
        const taskDisplay = document.getElementById('task');
        const answerInput = document.getElementById('answer-input');
        const submitAnswerBtn = document.getElementById('submit-answer-btn');
        const gameOverMessage = document.getElementById('game-over-message');
        const answerSection = document.getElementById('answer-section');
        const leaveGameBtn = document.getElementById('leave-game-btn');

        // --- APP STATE ---
        let db, auth;
        let currentUser = null;
        let currentLocation = null;
        let playersUnsubscribe = null;
        let gameUnsubscribe = null;
        let activeGameId = null;

        // --- TELEGRAM WEB APP INIT ---
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- HELPER FUNCTIONS ---
        
        /**
         * Shows a specific screen and hides others.
         * @param {string} screenName - The key of the screen to show.
         */
        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.classList.add('hidden'));
            if (screens[screenName]) {
                screens[screenName].classList.remove('hidden');
            }
        }
        
        /**
         * Displays an error message.
         * @param {string} message - The error message to display.
         */
        function showError(message) {
            errorMessage.textContent = message;
            showScreen('error');
        }

        /**
         * Calculates distance between two geo coordinates in kilometers using Haversine formula.
         * @param {object} coords1 - { latitude, longitude }
         * @param {object} coords2 - { latitude, longitude }
         * @returns {number} Distance in kilometers.
         */
        function getDistance(coords1, coords2) {
            function toRad(x) {
                return x * Math.PI / 180;
            }
            const R = 6371; // Earth's radius in km
            const dLat = toRad(coords2.latitude - coords1.latitude);
            const dLon = toRad(coords2.longitude - coords1.longitude);
            const lat1 = toRad(coords1.latitude);
            const lat2 = toRad(coords2.latitude);

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(lat1) * Math.cos(lat2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // --- FIREBASE & AUTHENTICATION ---
        
        /**
         * Initializes Firebase and sets up authentication.
         */
        async function initializeFirebase() {
            try {
                // These global variables are provided by the environment.
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                if (!firebaseConfig.apiKey) {
                    showError("Firebase configuration is missing. The app cannot start.");
                    return;
                }

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        console.log("User is signed in:", user.uid);
                        const tgUser = tg.initDataUnsafe?.user;
                        currentUser = {
                            uid: user.uid,
                            isAnonymous: user.isAnonymous,
                            name: tgUser?.first_name || `Player-${user.uid.substring(0, 5)}`,
                        };
                        userIdDisplay.textContent = currentUser.uid;
                        // Check if user is already in a game
                        listenForGameUpdates();
                    } else {
                        console.log("User is signed out. Attempting to sign in.");
                        if (initialAuthToken) {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } else {
                            await signInAnonymously(auth);
                        }
                    }
                });
            } catch (error) {
                console.error("Firebase Initialization Error:", error);
                showError("Could not connect to the server. Please try again later.");
            }
        }

        // --- GEOLOCATION & PLAYER LOGIC ---

        /**
         * Gets the user's current location and updates it in Firestore.
         */
        function findAndRegisterPlayer() {
            if (!navigator.geolocation) {
                showError("Geolocation is not supported by your browser.");
                return;
            }
            showScreen('loading');
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    currentLocation = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                    };
                    await updateUserLocationInFirestore();
                    listenForNearbyPlayers();
                    showScreen('playersList');
                },
                (error) => {
                    console.error("Geolocation Error:", error);
                    showError("Could not get your location. Please enable location services and try again.");
                }
            );
        }
        
        /**
         * Writes or updates the current user's location data in Firestore.
         */
        async function updateUserLocationInFirestore() {
            if (!currentUser || !currentLocation) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const playerRef = doc(db, `/artifacts/${appId}/public/data/players`, currentUser.uid);
            try {
                await setDoc(playerRef, {
                    name: currentUser.name,
                    location: new GeoPoint(currentLocation.latitude, currentLocation.longitude),
                    lastSeen: serverTimestamp(),
                }, { merge: true });
                console.log("Player location updated in Firestore.");
            } catch (error) {
                console.error("Error updating player location:", error);
                showError("Could not save your location. Please check your connection.");
            }
        }

        /**
         * Listens for real-time updates to the players collection.
         */
        function listenForNearbyPlayers() {
            if (playersUnsubscribe) playersUnsubscribe(); // Stop previous listener
            if (!currentUser || !currentLocation) return;

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const playersRef = collection(db, `/artifacts/${appId}/public/data/players`);
            
            playersUnsubscribe = onSnapshot(playersRef, (snapshot) => {
                const nearbyPlayers = [];
                snapshot.forEach((doc) => {
                    const playerData = doc.data();
                    // Exclude self and players without location
                    if (doc.id !== currentUser.uid && playerData.location) {
                        const distance = getDistance(currentLocation, playerData.location);
                        if (distance <= NEARBY_RADIUS_KM) {
                            nearbyPlayers.push({ id: doc.id, ...playerData, distance });
                        }
                    }
                });
                renderPlayersList(nearbyPlayers);
            }, (error) => {
                console.error("Error listening for players:", error);
                showError("Failed to get nearby players.");
            });
        }
        
        /**
         * Renders the list of nearby players in the UI.
         * @param {Array} players - An array of player objects.
         */
        function renderPlayersList(players) {
            nearbyPlayersContainer.innerHTML = '';
            if (players.length === 0) {
                noPlayersMessage.classList.remove('hidden');
            } else {
                noPlayersMessage.classList.add('hidden');
                players.forEach(player => {
                    const playerElement = document.createElement('div');
                    playerElement.className = 'bg-gray-800 p-4 rounded-lg flex justify-between items-center';
                    playerElement.innerHTML = `
                        <div>
                            <p class="font-semibold">${player.name}</p>
                            <p class="text-sm text-gray-400">${player.distance.toFixed(2)} km away</p>
                        </div>
                        <button class="start-game-btn bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition" data-player-id="${player.id}">
                            Start Game
                        </button>
                    `;
                    nearbyPlayersContainer.appendChild(playerElement);
                });
            }
        }

        // --- GAME LOGIC ---
        
        /**
         * Creates a new game document in Firestore.
         * @param {string} otherPlayerId - The ID of the player to start a game with.
         */
        async function createGame(otherPlayerId) {
            if (!currentUser) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            activeGameId = [currentUser.uid, otherPlayerId].sort().join('_');
            const gameRef = doc(db, `/artifacts/${appId}/public/data/games`, activeGameId);

            try {
                await setDoc(gameRef, {
                    players: [currentUser.uid, otherPlayerId],
                    tasks: SCAVENGER_HUNT_TASKS,
                    status: 'active',
                    createdAt: serverTimestamp(),
                    scores: {
                        [currentUser.uid]: 0,
                        [otherPlayerId]: 0,
                    },
                    currentTaskIndex: {
                        [currentUser.uid]: 0,
                        [otherPlayerId]: 0,
                    },
                });
                console.log("Game created with ID:", activeGameId);
                // The onSnapshot listener will handle switching to the game screen
            } catch (error) {
                console.error("Error creating game:", error);
                showError("Could not start the game.");
            }
        }
        
        /**
         * Listens for updates to any game the current user is part of.
         */
        function listenForGameUpdates() {
            if (gameUnsubscribe) gameUnsubscribe();
            if (!currentUser) return;

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const gamesRef = collection(db, `/artifacts/${appId}/public/data/games`);
            
            gameUnsubscribe = onSnapshot(gamesRef, (snapshot) => {
                let foundGame = false;
                snapshot.forEach((doc) => {
                    const gameData = doc.data();
                    if (gameData.players && gameData.players.includes(currentUser.uid) && gameData.status === 'active') {
                        activeGameId = doc.id;
                        renderGame(gameData);
                        foundGame = true;
                    }
                });

                if (foundGame) {
                    showScreen('game');
                    if (playersUnsubscribe) playersUnsubscribe(); // Stop looking for players
                } else {
                    activeGameId = null;
                    // If user was in game screen but game ended, go back to welcome
                    if (screens.game.offsetParent !== null) {
                        showScreen('welcome');
                    }
                }
            });
        }
        
        /**
         * Renders the current state of the game.
         * @param {object} gameData - The data for the current game.
         */
        function renderGame(gameData) {
            const userTaskIndex = gameData.currentTaskIndex[currentUser.uid];
            const userScore = gameData.scores[currentUser.uid];
            
            scoreDisplay.textContent = userScore;

            if (userTaskIndex >= gameData.tasks.length) {
                gameOverMessage.classList.remove('hidden');
                answerSection.classList.add('hidden');
            } else {
                taskDisplay.textContent = gameData.tasks[userTaskIndex].task;
                gameOverMessage.classList.add('hidden');
                answerSection.classList.remove('hidden');
                answerInput.value = '';
            }
        }
        
        /**
         * Submits the user's answer and updates the game state.
         */
        async function submitAnswer() {
            if (!activeGameId || !currentUser) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const gameRef = doc(db, `/artifacts/${appId}/public/data/games`, activeGameId);
            const answer = answerInput.value.trim().toLowerCase();
            
            // This requires a transaction or a read-then-write to be safe in a real app,
            // but for this demo, we'll do a simple update.
            onSnapshot(gameRef, async (docSnap) => {
                if (docSnap.exists()) {
                    const gameData = docSnap.data();
                    const userTaskIndex = gameData.currentTaskIndex[currentUser.uid];
                    
                    if (userTaskIndex < gameData.tasks.length && answer === gameData.tasks[userTaskIndex].answer) {
                        const newIndex = userTaskIndex + 1;
                        const newScore = gameData.scores[currentUser.uid] + 1;
                        
                        try {
                            await setDoc(gameRef, {
                                scores: { ...gameData.scores, [currentUser.uid]: newScore },
                                currentTaskIndex: { ...gameData.currentTaskIndex, [currentUser.uid]: newIndex }
                            }, { merge: true });
                            console.log("Correct answer submitted!");
                        } catch (error) {
                            console.error("Error updating game state:", error);
                        }
                    } else {
                        console.log("Incorrect answer.");
                        answerInput.classList.add('border-red-500', 'animate-shake');
                        setTimeout(() => answerInput.classList.remove('border-red-500', 'animate-shake'), 500);
                    }
                }
            }, { onlyOnce: true }); // Use onlyOnce to avoid race conditions with the main listener
        }
        
        /**
         * Deletes the game document from Firestore.
         */
        async function leaveGame() {
            if (!activeGameId) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const gameRef = doc(db, `/artifacts/${appId}/public/data/games`, activeGameId);
            try {
                await deleteDoc(gameRef);
                console.log("Game deleted.");
                showScreen('welcome');
            } catch (error) {
                console.error("Error leaving game:", error);
                showError("Could not leave the game. Please try again.");
            }
        }

        // --- EVENT LISTENERS ---
        findPlayersBtn.addEventListener('click', findAndRegisterPlayer);
        backToWelcomeBtn.addEventListener('click', () => {
            if (playersUnsubscribe) playersUnsubscribe();
            showScreen('welcome');
        });
        submitAnswerBtn.addEventListener('click', submitAnswer);
        answerInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') submitAnswer();
        });
        leaveGameBtn.addEventListener('click', leaveGame);

        document.body.addEventListener('click', (e) => {
            if (e.target && e.target.classList.contains('start-game-btn')) {
                const otherPlayerId = e.target.dataset.playerId;
                createGame(otherPlayerId);
            }
        });
        
        // --- INITIALIZATION ---
        initializeFirebase();

    </script>
    
    <!-- Custom animation for input shake -->
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>

</body>
</html>
