<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Community Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f4f4f5;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: -webkit-fill-available;
        }
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 70px; /* Space for nav bar */
        }
        .nav-bar {
            border-top: 1px solid var(--tg-theme-secondary-bg-color);
            background-color: var(--tg-theme-bg-color);
        }
        .nav-button.active svg, .nav-button.active span {
            color: var(--tg-theme-link-color);
        }
        .task-card {
            border: 1px solid #e5e7eb;
            transition: transform 0.2s ease-in-out;
        }
        .task-card:active {
            transform: scale(0.98);
        }
        .badge-icon {
            filter: grayscale(1);
            opacity: 0.4;
        }
        .badge-icon.unlocked {
            filter: none;
            opacity: 1;
        }
        .filter-tab.active {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }
        .interest-chip.selected {
            background-color: var(--tg-theme-link-color);
            color: var(--tg-theme-button-text-color);
            border-color: var(--tg-theme-link-color);
        }
        .action-button {
            background-color: var(--tg-theme-secondary-bg-color);
            transition: background-color 0.2s;
        }
        .action-button:active {
             background-color: #e5e7eb;
        }
        /* Styles for CRUD buttons */
        .crud-button {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s ease-in-out;
        }
        .crud-button:hover {
            filter: brightness(1.1);
        }
        .crud-button.delete {
            background-color: #ef4444; /* Red for delete */
        }
        .crud-button.delete:hover {
            background-color: #dc2626;
        }
        .crud-button.edit {
            background-color: #f59e0b; /* Amber for edit */
        }
        .crud-button.edit:hover {
            background-color: #d97706;
        }
        .crud-button.add {
            background-color: #22c55e; /* Green for add */
        }
        .crud-button.add:hover {
            background-color: #16a34a;
        }
        /* Profile Tabs */
        .profile-tab-button {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            color: var(--tg-theme-hint-color);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .profile-tab-button.active {
            border-color: var(--tg-theme-link-color);
            color: var(--tg-theme-link-color);
        }
        .profile-tab-content {
            padding-top: 16px;
        }
    </style>
</head>
<body class="antialiased">

    <div id="app" class="app-container">
        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Home Screen -->
            <div id="home-screen" class="p-4">
                <header class="flex justify-between items-center mb-4">
                    <div>
                        <h1 class="text-2xl font-bold">Volunteer HQ</h1>
                        <p class="text-sm" style="color: var(--tg-theme-hint-color);">Ready for deployment?</p>
                    </div>
                    <div class="text-right">
                        <div class="text-lg font-bold" id="user-score">0 PTS</div>
                        <div class="text-xs" style="color: var(--tg-theme-hint-color);">Service Score</div>
                    </div>
                </header>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button id="random-service-btn" class="action-button p-3 rounded-lg flex items-center justify-center text-sm font-semibold">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M3 7.9l4.1 4.1-4.1 4.1M21 7.9l-4.1 4.1 4.1 4.1M12 4v16"/></svg>
                        Random Service
                    </button>
                    <button id="find-partner-btn" class="action-button p-3 rounded-lg flex items-center justify-center text-sm font-semibold">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        Find Partner
                    </button>
                </div>
                
                <!-- Task Filters -->
                <div class="flex space-x-2 mb-4 overflow-x-auto pb-2">
                    <button class="filter-tab active whitespace-nowrap text-sm font-medium py-2 px-4 rounded-full" data-filter="foryou">For You</button>
                    <button class="filter-tab whitespace-nowrap text-sm font-medium py-2 px-4 rounded-full" data-filter="missions">Missions</button>
                    <button class="filter-tab whitespace-nowrap text-sm font-medium py-2 px-4 rounded-full" data-filter="nearby">Local Ops</button>
                </div>

                <div class="mb-4">
                    <h2 id="task-list-header" class="text-lg font-semibold mb-2">Recommended Tasks</h2>
                    <div id="task-list" class="space-y-3">
                        <!-- Tasks will be dynamically inserted here -->
                    </div>
                </div>
            </div>

            <!-- Leaderboard Screen -->
            <div id="leaderboard-screen" class="hidden p-4">
                <h1 class="text-2xl font-bold mb-4">Service Leaderboard</h1>
                <div id="leaderboard-list" class="space-y-2"></div>
            </div>

            <!-- Profile Screen -->
            <div id="profile-screen" class="hidden p-4">
                <div class="flex items-center mb-6">
                    <img src="https://placehold.co/80x80/EFEFEF/AAAAAA?text=V" class="w-20 h-20 rounded-full mr-4 border-2" style="border-color: var(--tg-theme-secondary-bg-color);">
                    <div>
                        <h1 id="profile-name" class="text-2xl font-bold">Volunteer</h1>
                        <p id="profile-score" class="text-lg" style="color: var(--tg-theme-hint-color);">0 PTS</p>
                    </div>
                    <div id="qrcode-container" class="ml-auto w-16 h-16 cursor-pointer" title="Tap to enlarge QR code">
                        <!-- QR Code will be generated here -->
                    </div>
                </div>

                <div class="mb-6">
                    <h2 class="text-lg font-semibold mb-2">My Interests</h2>
                    <div id="interest-chips" class="flex flex-wrap gap-2"></div>
                </div>

                <div>
                    <h2 class="text-lg font-semibold mb-2">Service Medals</h2>
                    <div id="badge-grid" class="grid grid-cols-4 gap-4 text-center"></div>
                </div>

                <!-- Profile Tabs for My Tasks and Done History -->
                <div class="mt-6 border-b" style="border-color: var(--tg-theme-secondary-bg-color);">
                    <div class="flex">
                        <button class="profile-tab-button active" data-tab="my-tasks">My Tasks</button>
                        <button class="profile-tab-button" data-tab="done-history">Done History</button>
                    </div>
                </div>

                <div id="profile-tab-contents" class="profile-tab-contents">
                    <div id="my-tasks-tab-content" class="profile-tab-content">
                        <button id="add-task-btn" class="crud-button add mb-4 mt-4 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 mr-1">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                            </svg>
                            Add New Task
                        </button>
                        <div id="my-task-list" class="space-y-3">
                            <!-- User's created tasks will be dynamically inserted here -->
                        </div>
                    </div>

                    <div id="done-history-tab-content" class="profile-tab-content hidden">
                        <div id="done-task-list" class="space-y-3">
                            <!-- User's completed tasks will be dynamically inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="nav-bar fixed bottom-0 left-0 right-0 h-[65px] flex justify-around items-center" style="background-color: var(--tg-theme-bg-color);">
            <button data-screen="home-screen" class="nav-button active flex flex-col items-center justify-center text-gray-500 w-full h-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span class="text-xs">Home</span>
            </button>
            <button data-screen="leaderboard-screen" class="nav-button flex flex-col items-center justify-center text-gray-500 w-full h-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 012-2h2a2 2 0 012 2v6m-6 0h6m-6 0H6a2 2 0 01-2-2v-6a2 2 0 012-2h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span class="text-xs">Leaders</span>
            </button>
            <!-- My Tasks button removed from main nav as it's now in Profile -->
            <button data-screen="profile-screen" class="nav-button flex flex-col items-center justify-center text-gray-500 w-full h-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span class="text-xs">Profile</span>
            </button>
        </nav>
    </div>

    <!-- Generic Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center p-4 z-50">
        <div id="modal-content" class="bg-white rounded-lg shadow-xl w-full max-w-md p-6" style="background-color: var(--tg-theme-bg-color);">
            <!-- Modal content will be injected here -->
        </div>
    </div>


    <script>
    // --- TELEGRAM WEB APP INITIALIZATION ---
    try {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
        document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
        document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color || '#999999');
        document.documentElement.style.setProperty('--tg-theme-link-color', tg.themeParams.link_color || '#2481cc');
        document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#2481cc');
        document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color || '#ffffff');
        document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#f4f4f5');
    } catch (e) {
        console.error("Telegram Web App script not found, running in browser mode.");
    }


    // --- DATABASE SETUP (IndexedDB) ---
    const DB_NAME = 'CommunityConnectDB_V3';
    const DB_VERSION = 1;
    let db;

    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains('tasks')) {
                    const taskStore = db.createObjectStore('tasks', { keyPath: 'id', autoIncrement: true });
                    taskStore.createIndex('category', 'category', { unique: false });
                    taskStore.createIndex('createdBy', 'createdBy', { unique: false }); // New index for tasks created by user
                }
                if (!db.objectStoreNames.contains('users')) db.createObjectStore('users', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('leaderboard')) db.createObjectStore('leaderboard', { keyPath: 'id' });
            };
            request.onsuccess = (event) => { db = event.target.result; console.log('Database initialized'); resolve(db); };
            request.onerror = (event) => { console.error('Database error:', event.target.errorCode); reject(event.target.errorCode); };
        });
    }

    // --- MOCK DATA & INITIALIZATION ---
    const ALL_BADGES = {
        service_ribbon: { name: 'Service Ribbon', icon: `<svg viewBox="0 0 100 100"><rect x="15" y="35" width="70" height="30" fill="#4a90e2"/><rect x="15" y="35" width="23" height="30" fill="#f5a623"/></svg>`, description: 'Complete your first task.' },
        commendation_medal: { name: 'Commendation Medal', icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#e84c3d"/><path d="M50 25 l10 20 l22 -8 l-8 22 l20 10 l-20 10 l8 22 l-22 -8 l-10 20 l-10 -20 l-22 8 l8 -22 l-20 -10 l20 -10 l-8 -22 l22 8z" fill="#f1c40f"/></svg>`, description: 'Complete 5 tasks.' },
        distinguished_service: { name: 'Distinguished Service', icon: `<svg viewBox="0 0 100 100"><path d="M50 10 L60 40 L90 40 L65 60 L75 90 L50 70 L25 90 L35 60 L10 40 L40 40 Z" fill="#f1c40f" stroke="#c0392b" stroke-width="5"/></svg>`, description: 'Complete 15 tasks.' },
        joint_ops_crest: { name: 'Joint Ops Crest', icon: `<svg viewBox="0 0 100 100"><path d="M20 80 L50 20 L80 80 Z" fill="#27ae60"/><path d="M20 80 h60 v-10 h-60 z" fill="#2c3e50"/></svg>`, description: 'Complete a task with a partner.' },
        recon_specialist: { name: 'Recon Specialist', icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="#bdc3c7" stroke-width="8"/><path d="M50 30 l20 40 h-40 z" fill="#3498db"/></svg>`, description: 'Complete a scavenger hunt task.'},
        campaign_medal: { name: 'Campaign Medal', icon: `<svg viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" fill="#8e44ad"/><path d="M50 30 L60 45 L50 60 L40 45 Z" fill="#ecf0f1"/></svg>`, description: 'Complete a mission task.'},
    };
    
    const ALL_INTERESTS = ['Environment', 'Animals', 'Community', 'Seniors', 'Education', 'Arts'];
    const ALL_CATEGORIES = ['nearby', 'scavenger', 'mission']; // For task creation form

    async function populateInitialData() {
        const user = await getObject('users', 'currentUser');
        if (!user) {
            await addObject('users', { id: 'currentUser', name: window.Telegram.WebApp.initDataUnsafe?.user?.first_name || 'Volunteer', score: 0, badges: [], completedTasks: [], interests: ['Environment', 'Community'] });
            await addObject('leaderboard', {id: 'user1', name: 'Alex', score: 150});
            await addObject('leaderboard', {id: 'user2', name: 'Bravo', score: 120});
            await addObject('leaderboard', {id: 'user3', name: 'Charlie', score: 95});
        }
        
        const tasks = await getAllObjects('tasks');
        if (tasks.length === 0) {
            const initialTasks = [
                { title: 'Community Garden Cleanup', description: 'Help clear out weeds from the local community garden.', latitude: 9.02, longitude: 38.77, points: 20, status: 'available', category: 'nearby', interest_tag: 'Environment', createdBy: 'system' },
                { title: 'Park Patrol', description: 'Join a group to pick up litter at Meskel Square Park.', latitude: 9.01, longitude: 38.76, points: 15, status: 'available', category: 'nearby', interest_tag: 'Environment', createdBy: 'system' },
                { title: 'Senior Support Run', description: 'Help an elderly resident with their weekly grocery shopping.', latitude: 9.03, longitude: 38.75, points: 25, status: 'available', category: 'nearby', interest_tag: 'Seniors', createdBy: 'system' },
                { title: 'Intel Drop: Book Donation', description: 'Find the hidden drop-off point for book donations.', latitude: 9.00, longitude: 38.78, points: 30, status: 'available', category: 'scavenger', interest_tag: 'Education', hint: 'Intel suggests a location near the large statue at the national museum. Box is concealed.', createdBy: 'system' },
                { title: 'Animal Shelter Support', description: 'Assist at the city animal shelter.', latitude: 9.04, longitude: 38.79, points: 20, status: 'available', category: 'nearby', interest_tag: 'Animals', createdBy: 'system' },
                { title: 'Operation Green City', description: 'Part of a major initiative to plant 100 trees this month.', latitude: 9.05, longitude: 38.74, points: 35, status: 'available', category: 'mission', interest_tag: 'Environment', missionName: 'Operation Green City', createdBy: 'system' },
            ];
            for (const task of initialTasks) await addObject('tasks', task);
        }
    }


    // --- DB HELPER FUNCTIONS ---
    function getObject(storeName, key) { return new Promise((resolve, reject) => { const req = db.transaction(storeName, 'readonly').objectStore(storeName).get(key); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); }
    function getAllObjects(storeName) { return new Promise((resolve, reject) => { const req = db.transaction(storeName, 'readonly').objectStore(storeName).getAll(); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); }
    function addObject(storeName, object) { return new Promise((resolve, reject) => { const req = db.transaction(storeName, 'readwrite').objectStore(storeName).add(object); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); }
    function updateObject(storeName, object) { return new Promise((resolve, reject) => { const req = db.transaction(storeName, 'readwrite').objectStore(storeName).put(object); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); }
    function deleteObject(storeName, key) { return new Promise((resolve, reject) => { const req = db.transaction(storeName, 'readwrite').objectStore(storeName).delete(key); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); }
    
    // Function to get objects by index
    function getObjectsByIndex(storeName, indexName, key) {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(storeName, 'readonly');
            const store = transaction.objectStore(storeName);
            const index = store.index(indexName);
            const request = index.getAll(key);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    // --- UI RENDERING ---
    async function renderAll(activeFilter = 'foryou') {
        await renderTasks(activeFilter);
        await renderLeaderboard();
        await renderProfile();
        // My Tasks and Done History will be rendered by renderProfile's tab logic
    }

    async function renderTasks(filter = 'foryou') {
        const taskList = document.getElementById('task-list');
        const taskListHeader = document.getElementById('task-list-header');
        const allTasks = await getAllObjects('tasks');
        const user = await getObject('users', 'currentUser');
        // Filter out tasks created by the current user from the main task list
        const availableTasks = allTasks.filter(t => t.status === 'available' && t.createdBy !== user.id);

        let filteredTasks = [];
        switch(filter) {
            case 'foryou': taskListHeader.textContent = 'Recommended Tasks'; filteredTasks = availableTasks.filter(t => user.interests.includes(t.interest_tag)); if (filteredTasks.length === 0) filteredTasks = availableTasks.slice(0, 5); break;
            case 'missions': taskListHeader.textContent = 'Active Missions'; filteredTasks = availableTasks.filter(t => t.category === 'mission'); break;
            case 'nearby': default: taskListHeader.textContent = 'Local Operations'; filteredTasks = availableTasks.filter(t => t.category === 'nearby' || t.category === 'scavenger'); break;
        }

        if (filteredTasks.length === 0) {
            taskList.innerHTML = `<div class="text-center p-8 border-2 border-dashed rounded-lg" style="border-color: var(--tg-theme-hint-color);"><p style="color: var(--tg-theme-hint-color);">No tasks available in this category.</p></div>`;
            return;
        }

        taskList.innerHTML = filteredTasks.map(task => {
            let tag = '';
            if (task.category === 'mission') tag = `<div class="mt-2 text-xs font-semibold" style="color: var(--tg-theme-link-color);">${task.missionName}</div>`;
            else if (task.category === 'scavenger') tag = `<div class="mt-2 text-xs font-semibold text-yellow-600">Recon Op</div>`;
            return `
            <div class="task-card rounded-lg p-4 shadow-sm cursor-pointer" style="background-color: var(--tg-theme-secondary-bg-color);" data-task-id="${task.id}">
                <div class="flex justify-between items-start">
                    <div><h3 class="font-bold text-md">${task.title}</h3><p class="text-sm mt-1" style="color: var(--tg-theme-hint-color);">${task.description.substring(0, 50)}...</p></div>
                    <div class="text-right ml-2 flex-shrink-0"><div class="font-bold text-lg" style="color: var(--tg-theme-link-color);">${task.points}</div><div class="text-xs" style="color: var(--tg-theme-hint-color);">PTS</div></div>
                </div>
                ${tag}
            </div>`}).join('');

        document.querySelectorAll('.task-card').forEach(card => card.addEventListener('click', () => showTaskModal(card.dataset.taskId)));
    }

    async function renderLeaderboard() {
        const list = document.getElementById('leaderboard-list');
        const currentUser = await getObject('users', 'currentUser');
        let otherUsers = await getAllObjects('leaderboard');
        const allUsers = [...otherUsers, {id: currentUser.id, name: currentUser.name, score: currentUser.score}];
        allUsers.sort((a, b) => b.score - a.score);

        list.innerHTML = allUsers.map((user, index) => `
            <div class="flex items-center p-3 rounded-lg ${user.id === 'currentUser' ? 'font-bold' : ''}" style="background-color: ${user.id === 'currentUser' ? 'rgba(36, 129, 204, 0.1)' : 'var(--tg-theme-secondary-bg-color)'};">
                <div class="w-8 text-lg font-bold" style="color: var(--tg-theme-hint-color);">${index + 1}</div>
                <img src="https://placehold.co/40x40/EFEFEF/AAAAAA?text=${user.name.charAt(0)}" class="w-10 h-10 rounded-full mr-4">
                <div class="flex-grow">${user.name}</div>
                <div class="font-bold" style="color: var(--tg-theme-link-color);">${user.score} PTS</div>
            </div>`).join('');
    }

    async function renderProfile() {
        const user = await getObject('users', 'currentUser');
        if (!user) return;

        document.getElementById('user-score').textContent = `${user.score} PTS`;
        document.getElementById('profile-name').textContent = user.name;
        document.getElementById('profile-score').textContent = `${user.score} PTS`;

            </div>`).join('');
        
        generateQRCode(`community-connect-user-${user.id}`);

        // Initialize profile tabs
        const profileTabButtons = document.querySelectorAll('.profile-tab-button');
        const profileTabContents = document.querySelectorAll('.profile-tab-content');

        profileTabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetTab = button.dataset.tab;

                profileTabButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                profileTabContents.forEach(content => content.classList.add('hidden'));
                document.getElementById(`${targetTab}-tab-content`).classList.remove('hidden');

                // Render content specific to the active tab
                if (targetTab === 'my-tasks') {
                    renderMyTasks();
                } else if (targetTab === 'done-history') {
                    renderDoneHistory();
                }
            });
        });

        // Initially render the default active tab (My Tasks)
        renderMyTasks();
        // Ensure done history is also rendered so data is available if user switches
        renderDoneHistory();
    }

    async function showTaskModal(taskId) {
        const task = await getObject('tasks', parseInt(taskId));
        if (!task) return;

        // Prevent completing tasks created by the current user from the main list
        const user = await getObject('users', 'currentUser');
        const isUserCreatedTask = task.createdBy === user.id;

        const isPartnerTask = Math.random() > 0.5; // This logic for partner task seems generic, keep as is.
        let partnerMessage = '';
        if (isPartnerTask) {
             const baseShare = task.points / 2;
             const synergyBonus = Math.ceil(baseShare * 0.2);
             const totalPerPerson = Math.round(baseShare + synergyBonus);
             partnerMessage = `<div class="mt-4 p-3 rounded-lg text-sm" style="background-color: var(--tg-theme-secondary-bg-color);">
                <span class="font-bold">🤝 Joint Operation!</span> You've been matched with <span class="font-bold">Alex</span>.
                <div class="mt-2 pt-2 border-t" style="border-color: var(--tg-theme-hint-color);">
                    <p class="font-semibold">Point Distribution:</p>
                    <p>Each operative earns ${totalPerPerson} points (${Math.round(baseShare)} base + ${synergyBonus} synergy bonus).</p>
                </div>
             </div>`;
        }
        
        const completeButton = isUserCreatedTask 
            ? `<button class="w-2/3 py-2 px-4 rounded-lg font-bold opacity-50 cursor-not-allowed" style="background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color);" disabled>Cannot Complete Your Own Task</button>`
            : `<button id="complete-task-btn" data-task-id="${task.id}" data-task-points="${task.points}" data-is-partner="${isPartnerTask}" data-task-category="${task.category}" class="w-2/3 py-2 px-4 rounded-lg font-bold" style="background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color);">Mark as Complete</button>`;


        const modalHTML = `
            <h2 class="text-xl font-bold mb-2">${task.title}</h2>
            <p class="mb-4" style="color: var(--tg-theme-hint-color);">${task.description}</p>
            ${task.category === 'scavenger' ? `<div class="mb-4 p-3 bg-yellow-100 text-yellow-800 rounded-lg text-sm"><span class="font-bold">Intel:</span> ${task.hint}</div>` : ''}

                <span class="font-bold text-lg" style="color: var(--tg-theme-link-color);">${task.points} Points</span>
                <span class="text-sm" style="color: var(--tg-theme-hint-color);"><a href="https://maps.google.com/?q=${task.latitude},${task.longitude}" target="_blank" style="color: var(--tg-theme-link-color);">View on Map</a></span>
            </div>
            ${partnerMessage}
            <div class="mt-6 flex space-x-2">
                <button class="close-modal-btn w-1/3 py-2 px-4 rounded-lg" style="background-color: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-text-color);">Abort</button>

            </div>`;

        if (!isUserCreatedTask) {
            document.getElementById('complete-task-btn').addEventListener('click', completeTask);
        }
    }

    async function completeTask(event) {
        const button = event.currentTarget;
        const taskId = parseInt(button.dataset.taskId);
        const basePoints = parseInt(button.dataset.taskPoints);
        const isPartnerTask = button.dataset.isPartner === 'true';
        const taskCategory = button.dataset.taskCategory;

        let pointsEarned = basePoints;
        let notificationMessage = `Task completed! +${basePoints} points!`;

        if (isPartnerTask) {
            const baseShare = basePoints / 2;
            const synergyBonus = Math.ceil(baseShare * 0.2);
            pointsEarned = Math.round(baseShare + synergyBonus);
            notificationMessage = `Joint Op success! You earned ${pointsEarned} points!`;
        }

        const task = await getObject('tasks', taskId);
        task.status = 'completed';
        await updateObject('tasks', task);

        const user = await getObject('users', 'currentUser');
        user.score += pointsEarned;
        // Only add to completedTasks if not already present (to prevent duplicates if user somehow completes same task multiple times)
        if (!user.completedTasks.includes(taskId)) {
            user.completedTasks.push(taskId);
        }

        // Check for badges
        if (!user.badges.includes('service_ribbon')) { user.badges.push('service_ribbon'); showNotification('Medal Awarded: Service Ribbon!'); }
        if (user.completedTasks.length >= 5 && !user.badges.includes('commendation_medal')) { user.badges.push('commendation_medal'); showNotification('Medal Awarded: Commendation Medal!'); }
        if (user.completedTasks.length >= 15 && !user.badges.includes('distinguished_service')) { user.badges.push('distinguished_service'); showNotification('Medal Awarded: Distinguished Service!'); }
        if (isPartnerTask && !user.badges.includes('joint_ops_crest')) { user.badges.push('joint_ops_crest'); showNotification('Medal Awarded: Joint Ops Crest!'); }
        if (taskCategory === 'scavenger' && !user.badges.includes('recon_specialist')) { user.badges.push('recon_specialist'); showNotification('Medal Awarded: Recon Specialist!'); }
        if (taskCategory === 'mission' && !user.badges.includes('campaign_medal')) { user.badges.push('campaign_medal'); showNotification('Medal Awarded: Campaign Medal!'); }

        await updateObject('users', user);

        hideModal();
        showNotification(notificationMessage);
        const activeFilter = document.querySelector('.filter-tab.active').dataset.filter;
        await renderAll(activeFilter); // Re-render all sections including profile tabs
    }
    
    function showNotification(message) {
        try {
            window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            window.Telegram.WebApp.showPopup({ title: 'Success', message: message, buttons: [{type: 'ok'}] });
        } catch (e) {
            const notif = document.createElement('div');
            notif.className = 'fixed top-5 left-1/2 -translate-x-1/2 bg-green-500 text-white py-2 px-4 rounded-full shadow-lg text-sm z-50';
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }
    }

    async function toggleInterest(event) {
        const chip = event.currentTarget;
        const interest = chip.dataset.interest;
        const user = await getObject('users', 'currentUser');
        const index = user.interests.indexOf(interest);
        if (index > -1) user.interests.splice(index, 1);
        else user.interests.push(interest);
        await updateObject('users', user);
        chip.classList.toggle('selected');
        if(document.getElementById('home-screen').offsetParent !== null && document.querySelector('.filter-tab.active').dataset.filter === 'foryou') {
            await renderTasks('foryou');
        }
    }

    function generateQRCode(text) {
        const container = document.getElementById('qrcode-container');
        container.innerHTML = ''; // Clear previous QR code

        try {
            const canvas = document.createElement('canvas');
            canvas.width = 128; // Adjust size as needed
            canvas.height = 128; // Adjust size as needed
            container.appendChild(canvas);

            new QRious({
                element: canvas,
                value: text,
                size: 128,
                background: 'white',
                backgroundAlpha: 1,
                foreground: 'black',
                foregroundAlpha: 1,
                level: 'L'
            });

            // Make the QR code clickable to show in a larger modal
            container.onclick = () => {
                showModal(`<div class="p-4"><img src="${canvas.toDataURL()}" class="w-full max-w-xs mx-auto" alt="Profile QR Code"></div>`);
            };

        } catch (e) {
            console.error("Error generating QR code:", e);
            container.innerHTML = '<p class="text-red-500 text-xs">QR Code Error</p>';
        }
    }

    // Save (Create/Update) Task
    async function saveTask(taskId = null) {
        const user = await getObject('users', 'currentUser');
        const title = document.getElementById('task-title').value;
        const description = document.getElementById('task-description').value;
        const points = parseInt(document.getElementById('task-points').value);
        const category = document.getElementById('task-category').value;
        const interest_tag = document.getElementById('task-interest-tag').value;

        let newTaskData = {
            title,
            description,
            points,
            category,
            interest_tag,
            status: 'available',
            createdBy: user.id // Mark task as created by the current user
        };

        // Add category-specific fields
        if (category === 'nearby' || category === 'scavenger') {
            newTaskData.latitude = parseFloat(document.getElementById('task-latitude')?.value) || 0;
            newTaskData.longitude = parseFloat(document.getElementById('task-longitude')?.value) || 0;
        }
        if (category === 'scavenger') {
            newTaskData.hint = document.getElementById('task-hint')?.value || '';
        }
        if (category === 'mission') {
            newTaskData.missionName = document.getElementById('task-mission-name')?.value || '';
        }

        if (taskId) {
            // Update existing task
            const existingTask = await getObject('tasks', taskId);
            Object.assign(existingTask, newTaskData);
            await updateObject('tasks', existingTask);
            showNotification('Task updated successfully!');
        } else {
            // Add new task
            await addObject('tasks', newTaskData);
            showNotification('Task created successfully!');
        }
        hideModal();
        // Re-render the active profile tab
        const activeProfileTab = document.querySelector('.profile-tab-button.active')?.dataset.tab;
        if (activeProfileTab === 'my-tasks') {
            await renderMyTasks();
        } else if (activeProfileTab === 'done-history') {
            await renderDoneHistory();
        }
        await renderTasks(document.querySelector('.filter-tab.active').dataset.filter); // Re-render main task list
    }

    // Confirm Delete Task
    function confirmDeleteTask(taskId) {
        const modalHtml = `
            <h2 class="text-xl font-bold mb-4">Confirm Deletion</h2>
            <p class="mb-6">Are you sure you want to delete this task? This action cannot be undone.</p>
            <div class="flex justify-end space-x-2">
                <button type="button" class="close-modal-btn py-2 px-4 rounded-lg" style="background-color: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-text-color);">Cancel</button>
                <button type="button" id="delete-task-confirm-btn" data-task-id="${taskId}" class="crud-button delete py-2 px-4 rounded-lg">Delete</button>
            </div>
        `;
        showModal(modalHtml);
        document.getElementById('delete-task-confirm-btn').addEventListener('click', deleteTask);
    }

    // Delete Task
    async function deleteTask(event) {
        const taskId = parseInt(event.currentTarget.dataset.taskId);
        await deleteObject('tasks', taskId);
        showNotification('Task deleted successfully!');
        hideModal();
        // Re-render the active profile tab
        const activeProfileTab = document.querySelector('.profile-tab-button.active')?.dataset.tab;
        if (activeProfileTab === 'my-tasks') {
            await renderMyTasks();
        } else if (activeProfileTab === 'done-history') {
            await renderDoneHistory();
        }
        await renderTasks(document.querySelector('.filter-tab.active').dataset.filter); // Re-render main task list
    }


    // --- NAVIGATION & EVENT LISTENERS ---
    function setupEventListeners() {
        document.querySelectorAll('.nav-button').forEach(button => {
            button.addEventListener('click', () => {
                const targetScreenId = button.dataset.screen;
                document.querySelectorAll('.main-content > div').forEach(screen => screen.classList.toggle('hidden', screen.id !== targetScreenId));
                document.querySelectorAll('.nav-button').forEach(btn => btn.classList.toggle('active', btn.dataset.screen === targetScreenId));
                document.querySelector('.main-content').scrollTop = 0;
                // If navigating to Profile, ensure profile tabs are rendered
                if (targetScreenId === 'profile-screen') {
                    renderProfile(); // This will handle rendering the default tab (My Tasks)
                }
            });
        });
        
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderTasks(tab.dataset.filter);
            });
        });

        document.getElementById('random-service-btn').addEventListener('click', getRandomService);
        document.getElementById('find-partner-btn').addEventListener('click', findRandomPartner);
        // The add-task-btn is now inside the profile screen, its listener will be set up by renderMyTasks
        document.getElementById('add-task-btn').addEventListener('click', () => showTaskFormModal()); 
    }

    // --- APP START ---
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            await initDB();
            await populateInitialData();
            await renderAll();
            setupEventListeners();
        } catch (error) {
            console.error("Failed to initialize the app:", error);
            document.getElementById('task-list').innerHTML = `<div class="text-center p-8 border-2 border-dashed rounded-lg text-red-500"><p>Could not load app data. Please try again.</p></div>`;
        }
    });

    </script>
</body>
</html>
